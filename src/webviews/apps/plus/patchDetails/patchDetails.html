<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style nonce="#{cspNonce}">
			@font-face {
				font-family: 'codicon';
				font-display: block;
				src: url('#{webroot}/codicon.ttf?2ab61cbaefbdf4c7c5589068100bee0c') format('truetype');
			}
			@font-face {
				font-family: 'glicons';
				font-display: block;
				src: url('#{root}/dist/glicons.woff2?61b1b84924a0e8a910a5763300421910') format('woff2');
			}
		</style>
	</head>

	<body
		class="preload"
		data-placement="#{placement}"
		data-vscode-context='{ "preventDefaultContextMenuItems": true, "webview": "#{webviewId}" }'
	>
		<gl-patch-details-root
			name="PatchDetailsApp"
			placement="#{placement}"
			context="#{state}"
		></gl-patch-details-root>
		#{endOfBody}
	</body>
</html>
