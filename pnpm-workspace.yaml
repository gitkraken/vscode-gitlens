packages:
    - '.'
    - 'packages/*'
    - 'packages/plus/*'
    - 'tests/fixtures/*'

allowBuilds:
    '@parcel/watcher': false
    '@playwright/browser-chromium': false
    '@swc/core': false
    '@vscode/vsce-sign': false
    es5-ext: false
    esbuild: false
    keytar: false
    rs-module-lexer: false
    sharp: false
    ttf2woff2: false
    unrs-resolver: false

blockExoticSubdeps: true

catalog:
    '@vscode/l10n': 0.0.18
    # Publish gates for the two @gitkraken/* graph packages: attw resolves the packed tarball's types
    # under every module-resolution mode, publint lints the manifest a consumer actually installs.
    '@arethetypeswrong/cli': 0.18.5
    '@awesome.me/webawesome': 3.12.0
    '@lit-labs/virtualizer': 2.1.1
    '@gitkraken/provider-apis': 0.65.7
    # The @octokit/* packages depend on each other; version them as a family so a lone bump can't
    # split them. @octokit/graphql wants `@octokit/request: ^10.0.6` — see the overrides entry.
    '@octokit/graphql': 9.0.4
    '@octokit/request': 10.0.14
    '@octokit/request-error': 7.1.1
    '@octokit/types': 17.0.0
    '@types/mocha': 10.0.10
    '@types/sinon': 22.0.0
    esbuild: 0.28.2
    # Only @gitlens/utils depends on this, but it flows into the published @gitkraken/core-gitlens
    # manifest, which must never carry a version of its own to drift from.
    fast-string-truncated-width: 3.0.3
    ignore: 7.0.9
    lit: 3.3.3
    mocha: 11.8.0
    publint: 0.3.24
    # Shared by the root webview build and the publishable commit-graph UI stylesheet build.
    sass-embedded: 1.104.1
    sinon: 22.1.0
    tinybench: 6.2.0
    # Bundler for the publishable graph packages. It pulls rolldown itself — never depend on
    # rolldown directly, or the two versions drift and the plugin API breaks.
    tsdown: 0.23.0
    tsx: 4.23.13
    # 7.x is the native port: it ships `tsc` only — no `typescript.js` API and no `tsserver.js`. The
    # editor therefore uses VS Code's bundled TypeScript (hence no `js/ts.tsdk.path` in
    # .vscode/settings.json), and @custom-elements-manifest/analyzer keeps its own 5.4.x for the
    # compiler API it needs.
    typescript: 7.0.2
    # scripts/generateTelemetryDocs.mjs drives the compiler API to expand telemetry types into docs/telemetry-events.md.
    # 7.0 exposes no compiler API, so this pins the 7.1 beta for its `sync` API — far faster than the 6.x JS compiler
    # it replaced. Aliased rather than catalogued as `typescript` so the extension's own compiler stays on stable;
    # once a stable 7.1 ships, move `typescript` to it and drop this alias.
    typescript-beta: npm:typescript@7.1.0-beta
    vscode-uri: 3.2.0
    yaml: 2.9.1

enableGlobalVirtualStore: true

minimumReleaseAge: 7200

minimumReleaseAgeExclude:
    # First-party/trusted scopes — exempt from the release-age gate
    - '@eamodio/*'
    - '@gitkraken/*'
    - '@vscode/*'
    - '@oxfmt/binding-android-arm-eabi@0.67.0'
    - '@oxfmt/binding-android-arm64@0.67.0'
    - '@oxfmt/binding-darwin-arm64@0.67.0'
    - '@oxfmt/binding-darwin-x64@0.67.0'
    - '@oxfmt/binding-freebsd-x64@0.67.0'
    - '@oxfmt/binding-linux-arm-gnueabihf@0.67.0'
    - '@oxfmt/binding-linux-arm-musleabihf@0.67.0'
    - '@oxfmt/binding-linux-arm64-gnu@0.67.0'
    - '@oxfmt/binding-linux-arm64-musl@0.67.0'
    - '@oxfmt/binding-linux-ppc64-gnu@0.67.0'
    - '@oxfmt/binding-linux-riscv64-gnu@0.67.0'
    - '@oxfmt/binding-linux-riscv64-musl@0.67.0'
    - '@oxfmt/binding-linux-s390x-gnu@0.67.0'
    - '@oxfmt/binding-linux-x64-gnu@0.67.0'
    - '@oxfmt/binding-linux-x64-musl@0.67.0'
    - '@oxfmt/binding-openharmony-arm64@0.67.0'
    - '@oxfmt/binding-win32-arm64-msvc@0.67.0'
    - '@oxfmt/binding-win32-ia32-msvc@0.67.0'
    - '@oxfmt/binding-win32-x64-msvc@0.67.0'
    - '@oxlint/binding-android-arm-eabi@1.83.0'
    - '@oxlint/binding-android-arm64@1.83.0'
    - '@oxlint/binding-darwin-arm64@1.83.0'
    - '@oxlint/binding-darwin-x64@1.83.0'
    - '@oxlint/binding-freebsd-x64@1.83.0'
    - '@oxlint/binding-linux-arm-gnueabihf@1.83.0'
    - '@oxlint/binding-linux-arm-musleabihf@1.83.0'
    - '@oxlint/binding-linux-arm64-gnu@1.83.0'
    - '@oxlint/binding-linux-arm64-musl@1.83.0'
    - '@oxlint/binding-linux-ppc64-gnu@1.83.0'
    - '@oxlint/binding-linux-riscv64-gnu@1.83.0'
    - '@oxlint/binding-linux-riscv64-musl@1.83.0'
    - '@oxlint/binding-linux-s390x-gnu@1.83.0'
    - '@oxlint/binding-linux-x64-gnu@1.83.0'
    - '@oxlint/binding-linux-x64-musl@1.83.0'
    - '@oxlint/binding-openharmony-arm64@1.83.0'
    - '@oxlint/binding-win32-arm64-msvc@1.83.0'
    - '@oxlint/binding-win32-ia32-msvc@1.83.0'
    - '@oxlint/binding-win32-x64-msvc@1.83.0'
    - '@oxlint/plugins@1.83.0'
    - oxfmt@0.67.0
    - oxlint@1.83.0
    - rolldown-plugin-dts@0.28.5
    - tinyexec@1.3.1
    - tsdown@0.23.0
    - '@typescript/typescript-aix-ppc64@7.1.0-beta'
    - '@typescript/typescript-android-arm64@7.1.0-beta'
    - '@typescript/typescript-darwin-arm64@7.1.0-beta'
    - '@typescript/typescript-darwin-x64@7.1.0-beta'
    - '@typescript/typescript-freebsd-arm64@7.1.0-beta'
    - '@typescript/typescript-freebsd-x64@7.1.0-beta'
    - '@typescript/typescript-linux-arm@7.1.0-beta'
    - '@typescript/typescript-linux-arm64@7.1.0-beta'
    - '@typescript/typescript-linux-loong64@7.1.0-beta'
    - '@typescript/typescript-linux-mips64el@7.1.0-beta'
    - '@typescript/typescript-linux-ppc64@7.1.0-beta'
    - '@typescript/typescript-linux-riscv64@7.1.0-beta'
    - '@typescript/typescript-linux-s390x@7.1.0-beta'
    - '@typescript/typescript-linux-x64@7.1.0-beta'
    - '@typescript/typescript-netbsd-arm64@7.1.0-beta'
    - '@typescript/typescript-netbsd-x64@7.1.0-beta'
    - '@typescript/typescript-openbsd-arm64@7.1.0-beta'
    - '@typescript/typescript-openbsd-x64@7.1.0-beta'
    - '@typescript/typescript-sunos-x64@7.1.0-beta'
    - '@typescript/typescript-win32-arm64@7.1.0-beta'
    - '@typescript/typescript-win32-x64@7.1.0-beta'
    - typescript@7.1.0-beta

overrides:
    '@opentelemetry/core@<2.8.0': ^2.8.0
    # @octokit/graphql's own `^10.0.6` range otherwise resolves to a second copy alongside
    # @gitlens/git-github's direct pin, and github.ts imports both.
    '@octokit/request': 'catalog:'
    '@types/vscode': '1.101.0'
    '@xmldom/xmldom@<0.8.13': ^0.8.13
    # Overlapping DoS advisories (CVE-2026-13149 / -14257 / -69152, plus newer recursion and
    # quadratic-expansion ones) patch on different lines, so each major needs its own floor. A
    # single `<2.1.7` selector would also match the 1.x copy and force it past minimatch@3's
    # `^1.1.7` range.
    'brace-expansion@<1.1.21': ^1.1.21
    'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
    'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
    diff@>=6.0.0 <8.0.3: ^8.0.3
    esbuild: 'catalog:'
    # CVE-2026-18446 plus later host-confusion / authority-injection advisories, patched by 3.1.9.
    # Bounded to the 3.x line — the advisories also cover 2.x (<2.4.4), and an unbounded selector
    # would force a major jump.
    'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
    # Critical advisories: JS injection via AST type confusion and an own-property check bypass.
    handlebars: '4.7.10'
    # Four advisories (CVE-2026-71848/-71849/-71850/-69207) landed on 4.12.34, with later ones
    # through 4.13.11. Only reached via @modelcontextprotocol/sdk, whose stdio transport never
    # loads hono — fixed for hygiene.
    'hono@<4.13.11': ^4.13.11
    'ip-address@<10.7.4': ^10.7.4
    # GHSA-5p4m-2wfm-xmqj: quadratic CPU in !!omap resolution, never backported to 4.x. Bounded
    # below at 4.0.0 so the selector can't drag a 3.x copy across js-yaml's breaking v4 API change.
    'js-yaml@>=4.0.0 <4.3.1': ^4.3.1
    # GHSA-jxfw-x594-9x9m: Unicode line separators (NEL/U+2028/U+2029) survive morgan's escaping
    # into the access log, letting a request forge log records. Dev-only, via @vscode/test-web's
    # koa-morgan, which is unmaintained and ranges wide open (`^1.6.1`) — so the floor lives here.
    'morgan@<1.12.0': ^1.12.0
    # GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g, both parse-side. Neither path reaches parse:
    # @modelcontextprotocol/sdk keeps express in its HTTP/auth transports and
    # scripts/mcp-vscode-server.mjs uses stdio, and typed-rest-client only calls qs.stringify.
    # Fixed for hygiene. 6.16.1 adds GHSA-6pq8-jhm2-2vcw, a stringify-side DoS limited to
    # `arrayFormat: 'comma'`.
    'qs@<6.16.1': ^6.16.1
    'serialize-javascript@<7.1.3': '^7.1.3'

patchedDependencies:
    '@vscode/l10n-dev@0.0.35': patches/@vscode__l10n-dev@0.0.35.patch
    fantasticon@4.1.0: patches/fantasticon@4.1.0.patch
    lit-html: patches/lit-html.patch
