name: Publish pre-release

on:
    schedule:
        - cron: '0 9 * * *' # every day at 4am EST
    workflow_dispatch:

jobs:
    check:
        name: Check for updates
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            status: ${{ steps.earlyexit.outputs.status }}
            previous_pre_ref: ${{ steps.earlyexit.outputs.previous_pre_ref }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - id: earlyexit
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  if git rev-parse origin/pre >/dev/null 2>&1; then
                    preRef=$(git show-ref -s origin/pre)
                    headRef=$(git show-ref --head -s head)
                    echo "origin/pre"
                    echo $preRef
                    echo "HEAD"
                    echo $headRef
                    if [ "$preRef" = "$headRef" ]; then
                      echo "No changes since last pre-release build. Exiting."
                      echo "status=unchanged" >> $GITHUB_OUTPUT
                      exit 0
                    else
                      echo "Updating pre"
                      echo "previous_pre_ref=$preRef" >> $GITHUB_OUTPUT
                      git push origin --delete pre
                      git checkout -b pre
                      git push origin pre
                    fi
                  else
                    echo "No pre branch. Creating."
                    git checkout -b pre
                    git push origin pre
                  fi
                  echo "status=changed" >> $GITHUB_OUTPUT

    publish:
        name: Publish pre-release
        needs: check
        runs-on: ubuntu-latest
        if: needs.check.outputs.status == 'changed'
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
            - name: Install
              run: pnpm install
            - name: Apply pre-release patch
              run: pnpm run patch-pre
            - name: Setup Environment
              run: node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version + '\nPACKAGE_NAME=' + require('./package.json').name + '-' + require('./package.json').version)" >> $GITHUB_ENV
            - name: Package extension
              run: pnpm run package --pre-release
            - name: Package extension for forks
              run: pnpm run package-forks --pre-release
            - name: Publish extension to VS Code Marketplace
              id: publish-marketplace
              run: |
                  for attempt in $(seq 1 5); do
                    if pnpm vsce publish --no-dependencies --pre-release --packagePath "./${PACKAGE_NAME}.vsix" -p "${{ secrets.GITLENS_VSCODE_MARKETPLACE_PAT }}"; then
                      exit 0
                    fi

                    if [ "$attempt" -lt 5 ]; then
                      delay=$((30 * 2 ** (attempt - 1)))
                      echo "::warning::Marketplace publish attempt ${attempt} of 5 failed; retrying in ${delay}s."
                      sleep "$delay"
                    fi
                  done

                  echo "::error::Marketplace publish failed after 5 attempts."
                  exit 1
            - name: Roll back pre-release tagging
              # The `check` job moved `origin/pre` to HEAD before anything published. Left in place, the next
              # scheduled run sees no changes and never retries this commit, so undo it when publishing fails.
              if: failure() && steps.publish-marketplace.outcome == 'failure'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREVIOUS_PRE_REF: ${{ needs.check.outputs.previous_pre_ref }}
              run: |
                  if [ -n "$PREVIOUS_PRE_REF" ]; then
                    echo "Restoring origin/pre to $PREVIOUS_PRE_REF"
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/pre" -f sha="$PREVIOUS_PRE_REF" -F force=true
                  else
                    echo "Deleting origin/pre; it did not exist before this run"
                    gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/pre"
                  fi
            - name: Publish extension to OpenVSIX
              run: pnpm ovsx publish ./${{ env.PACKAGE_NAME }}-forks.vsix -p ${{ secrets.GITLENS_OPENVSIX_PAT }}
            - name: Tag pre-release commit
              env:
                  TAG: releases/ext/pre/v${{ env.PACKAGE_VERSION }}
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
                      echo "::warning::Tag $TAG already exists on origin; skipping tag push."
                      exit 0
                  fi
                  git tag -a "$TAG" -m "Pre-release v${{ env.PACKAGE_VERSION }}"
                  git push origin "$TAG"
            - name: Publish artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ env.PACKAGE_NAME }}.vsix
                  path: ./${{ env.PACKAGE_NAME }}.vsix
