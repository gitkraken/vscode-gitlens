name: Publish pre-release

on:
    schedule:
        - cron: '0 9 * * *' # every day at 4am EST
    workflow_dispatch:

# `pre` is only advanced once a run has fully published, so two overlapping runs would both read the
# stale ref and publish the same commit twice. Queue them instead of cancelling — the second run's
# check then sees the first run's `pre` and exits as unchanged.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    check:
        name: Check for updates
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            status: ${{ steps.earlyexit.outputs.status }}
        steps:
            - id: earlyexit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # `gh api` prints its error body to stdout on a 404, so clear it on a nonzero exit
                  # rather than letting that JSON land in preRef and masquerade as a sha.
                  preRef=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/pre" --jq .object.sha 2>/dev/null) || preRef=''
                  echo "pre:  ${preRef:-<none>}"
                  echo "HEAD: ${GITHUB_SHA}"
                  if [ "$preRef" = "$GITHUB_SHA" ]; then
                    echo "No changes since last pre-release build. Exiting."
                    echo "status=unchanged" >> $GITHUB_OUTPUT
                    exit 0
                  fi
                  echo "status=changed" >> $GITHUB_OUTPUT

    publish:
        name: Publish pre-release
        needs: check
        runs-on: ubuntu-latest
        if: needs.check.outputs.status == 'changed'
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
            - name: Install
              run: pnpm install
            - name: Apply pre-release patch
              run: pnpm run patch-pre
            - name: Setup Environment
              run: node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version + '\nPACKAGE_NAME=' + require('./package.json').name + '-' + require('./package.json').version)" >> $GITHUB_ENV
            - name: Package extension
              run: pnpm run package --pre-release
            - name: Package extension for forks
              run: pnpm run package-forks --pre-release
            - name: Publish extension to VS Code Marketplace
              run: |
                  for attempt in $(seq 1 5); do
                    if pnpm vsce publish --no-dependencies --pre-release --packagePath "./${PACKAGE_NAME}.vsix" -p "${{ secrets.GITLENS_VSCODE_MARKETPLACE_PAT }}"; then
                      exit 0
                    fi

                    if [ "$attempt" -lt 5 ]; then
                      delay=$((30 * 2 ** (attempt - 1)))
                      echo "::warning::Marketplace publish attempt ${attempt} of 5 failed; retrying in ${delay}s."
                      sleep "$delay"
                    fi
                  done

                  echo "::error::Marketplace publish failed after 5 attempts."
                  exit 1
            - name: Publish extension to OpenVSIX
              run: pnpm ovsx publish ./${{ env.PACKAGE_NAME }}-forks.vsix -p ${{ secrets.GITLENS_OPENVSIX_PAT }}
            - name: Tag pre-release commit
              env:
                  TAG: releases/ext/pre/v${{ env.PACKAGE_VERSION }}
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
                      echo "::warning::Tag $TAG already exists on origin; skipping tag push."
                      exit 0
                  fi
                  git tag -a "$TAG" -m "Pre-release v${{ env.PACKAGE_VERSION }}"
                  git push origin "$TAG"
            - name: Advance pre to the published commit
              # `pre` marks the commit currently on the pre-release channel, and moves only here — after a
              # full successful publish. Any earlier failure or a cancellation leaves it untouched, so the
              # next run (or a re-run of this job) retries that commit instead of skipping it as unchanged.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/pre" >/dev/null 2>&1; then
                    echo "Advancing pre to ${GITHUB_SHA}"
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/pre" -f sha="${GITHUB_SHA}" -F force=true
                  else
                    echo "Creating pre at ${GITHUB_SHA}"
                    gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/pre" -f sha="${GITHUB_SHA}"
                  fi
            - name: Publish artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ env.PACKAGE_NAME }}.vsix
                  path: ./${{ env.PACKAGE_NAME }}.vsix
