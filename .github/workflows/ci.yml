name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches: ['*']
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    workflow_dispatch:
        inputs:
            cli_insiders:
                description: 'Also run the opt-in GK CLI insiders-channel E2E specs (@cli-insiders)'
                type: boolean
                default: false

jobs:
    build:
        name: Format, Typecheck, Lint, & Build
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.run_attempt != '1' }}
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run fmt:check

            # `--stats` writes out/webviews-stats.json from this same compilation (assets + entrypoints
            # only, no analyzer instrumentation, no forced source maps), so the bundle budget below
            # measures the exact bundle GitLens ships instead of a separate analyzer-only build.
            - name: Build (production)
              run: pnpm run bundle:stats

            # The production build above emits the authoritative webpack stats. Reuse them here so the
            # bundle budget doesn't compile the webviews a second time.
            - name: Check graph production bundle size
              run: pnpm run benchmark:graph:bundle:check

            # Upload on both pass and fail (skip only on cancel) so the measurement is available to inspect
            # even when the budget check fails on an over-budget bundle. `ignore` (not `error`) on a missing
            # file so a check that fails before writing the file surfaces its own error, not an unrelated
            # "no files found" from this step.
            - name: Upload graph bundle measurements
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: graph-bundle-performance
                  path: out/perf/graph-bundle.json
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Verify generated files are current
              run: git diff --exit-code -- ThirdPartyNotices.txt docs/telemetry-events.md

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.run_attempt != '1' }}
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm run build:packages

            - name: Lint graph package CSS
              run: pnpm run lint:css:graph-packages

            # `test:packages` without its dependency ordering (`--no-sort`): every package is already built above,
            # so the ordering only held the slowest suite (plus/integrations) back until its dependencies' tests
            # finished. Locally `test:packages` keeps the ordering, since a package's test may build what it needs.
            - name: Run package unit tests
              run: pnpm -r --no-sort --filter "./packages/**" run test

            # `--quick` skips the format, lint/type-check, dependency, and localization gates; the `build`
            # job's production bundle already runs every one of them over the whole project.
            - name: Build test files
              run: pnpm run build:tests --quick

            # Invoke vscode-test directly: `pnpm run test` would rebuild the tests (its `pretest` hook) and
            # re-run every package suite (`pnpm -r test`) that the steps above already ran.
            - name: Run unit tests
              run: xvfb-run -a pnpm exec vscode-test

            # The package tests are bundled by esbuild, so they resolve CommonJS dependencies through a
            # bundler's interop and never exercise Node's. Bundle and load the published tree the way an
            # external Node ESM consumer does, so an import that only a bundler can link fails here rather
            # than in a consumer.
            - name: Bundle core package
              run: pnpm --filter @gitkraken/core-gitlens run build

            - name: Verify core package loads under Node ESM
              run: pnpm --filter @gitkraken/core-gitlens run verify:esm

            - name: Verify packed core package as an external consumer
              run: pnpm --filter @gitkraken/core-gitlens run verify:package

            - name: Build graph packages
              run: pnpm run build:graph-packages

            - name: Verify packed graph packages as external consumers
              run: pnpm run verify:graph-packages

    # Its own job so the slowest suite runs alongside Unit Tests rather than after it
    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.run_attempt != '1' }}
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm run build:packages

            # Excluded from `pnpm run test` because they spawn real git against temp repos; run them
            # here so the provider suites that exercise actual git behavior still gate CI.
            - name: Run integration tests
              run: pnpm --filter ./packages/git-cli run test:integration

    derive-matrix:
        name: Derive editor matrix
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        outputs:
            editors: ${{ steps.gen.outputs.editors }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            # Single source of truth for the editor matrix is tests/e2e/editors.ts; read it directly
            # (Node strips the TS types) so the CI matrix never drifts from the Playwright projects.
            # `ciEditors` is `editors` minus login-walled forks (e.g. Cursor) that can't run in CI —
            # the exclusion lives in the registry, not here, so this step stays a dumb serializer.
            - name: Generate matrix
              id: gen
              run: |
                  editors=$(node --experimental-strip-types -e "import('./tests/e2e/editors.ts').then(m => console.log(JSON.stringify(m.ciEditors)))")
                  # Heredoc-delimited output is robust even if the value ever spans lines — this is the
                  # workflow's source of truth, and a bare `echo name=$value` would corrupt fromJSON().
                  {
                    echo "editors<<EOF"
                    echo "$editors"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

    e2e-tests:
        name: E2E Tests (${{ matrix.editor.name }})
        needs: derive-matrix
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 25
        # Experimental forks have known editor-specific UI gaps; keep them informational so they don't
        # block CI, while non-experimental editors (VS Code, Windsurf) remain required.
        continue-on-error: ${{ matrix.editor.experimental }}
        strategy:
            fail-fast: false
            matrix:
                editor: ${{ fromJSON(needs.derive-matrix.outputs.editors) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build (production with DEBUG for simulator)
              run: pnpm run bundle:e2e

            # Provisions a VS Code-compatible editor binary for forks and exposes its path via the
            # editor's env var (matrix.editor.envVar), which the Playwright project reads. VS Code
            # itself is downloaded by the harness, so no path is emitted for it.
            - name: Provision editor
              run: |
                  set -euo pipefail
                  id="${{ matrix.editor.id }}"
                  exe=""
                  case "$id" in
                    vscode)
                      : # Harness downloads VS Code via @vscode/test-electron
                      ;;
                    windsurf)
                      url=$(curl -fsSL "https://windsurf-stable.codeium.com/api/update/linux-x64/stable/latest" | jq -r '.url')
                      echo "Downloading Windsurf: $url"
                      curl -fsSL "$url" -o /tmp/windsurf.tar.gz
                      mkdir -p /tmp/windsurf && tar -xzf /tmp/windsurf.tar.gz -C /tmp/windsurf
                      # Windsurf's Electron binary is named after its codename (devin-desktop)
                      exe=$(find /tmp/windsurf -maxdepth 2 -type f \( -name devin-desktop -o -name windsurf \) | head -n1)
                      ;;
                    kiro)
                      url=$(curl -fsSL "https://prod.download.desktop.kiro.dev/stable/metadata-linux-x64-stable.json" | jq -r '.releases[].updateTo.url | select(endswith(".tar.gz"))' | head -n1)
                      echo "Downloading Kiro: $url"
                      curl -fsSL "$url" -o /tmp/kiro.tar.gz
                      mkdir -p /tmp/kiro && tar -xzf /tmp/kiro.tar.gz -C /tmp/kiro
                      exe=$(find /tmp/kiro -maxdepth 2 -type f -name kiro | head -n1)
                      ;;
                    cursor)
                      url=$(curl -fsSL "https://www.cursor.com/api/download?platform=linux-x64&releaseTrack=stable" | jq -r '.downloadUrl')
                      echo "Downloading Cursor: $url"
                      curl -fsSL "$url" -o /tmp/cursor.AppImage
                      chmod +x /tmp/cursor.AppImage
                      ( cd /tmp && ./cursor.AppImage --appimage-extract >/dev/null )
                      exe=$(find /tmp/squashfs-root -type f -path '*/usr/share/cursor/cursor' | head -n1)
                      [ -z "$exe" ] && exe=$(find /tmp/squashfs-root -maxdepth 2 -type f -name cursor | head -n1)
                      ;;
                    positron)
                      # Positron ships no GitHub release assets; binaries live on Posit's CDN.
                      # releases.json carries the current version's direct .deb URL (no version hardcode).
                      url=$(curl -fsSL "https://cdn.posit.co/positron/releases/deb/x86_64/releases.json" | jq -r '.url')
                      echo "Downloading Positron: $url"
                      curl -fsSL "$url" -o /tmp/positron.deb
                      mkdir -p /tmp/positron && dpkg-deb -x /tmp/positron.deb /tmp/positron
                      # Electron binary is /usr/share/positron/positron (code-oss layout); the bin/ wrapper is deeper
                      exe=$(find /tmp/positron/usr/share -maxdepth 2 -type f -name positron | head -n1)
                      ;;
                    *)
                      echo "::error::Unknown editor id '$id'"; exit 1
                      ;;
                  esac
                  if [ "$id" != "vscode" ]; then
                    if [ -z "$exe" ] || [ ! -f "$exe" ]; then
                      echo "::error::Could not resolve $id executable"; exit 1
                    fi
                    chmod +x "$exe"
                    echo "Resolved $id executable: $exe"
                    # Expose the path via the editor's env var so the Playwright project picks it up.
                    echo "${{ matrix.editor.envVar }}=$exe" >> "$GITHUB_ENV"
                  fi

            # Invoke Playwright directly via `pnpm exec` — `pnpm run test:e2e -- --project=<id>`
            # keeps the literal `--`, which Playwright treats as a positional filter (not the
            # `--project` option), so the filter is ignored and EVERY registered project runs
            # (e.g. vscode + windsurf → ~2x the tests). Passing --project straight to the binary
            # applies it correctly, keeping each matrix job scoped to its own editor.
            # `--workers` per editor (editors.ts `ciWorkers`, default 4): heavier forks (Positron) thrash
            # the runner at 4 concurrent Electron instances, so they run with fewer.
            # `cli_insiders` opts the `@cli-insiders` specs in (they skip without it). Each matrix leg
            # is its own runner with an empty CLI data dir, so enabling it costs a pre-release core
            # download per editor, not once per run.
            # `@signed-in` specs run in their own job (`e2e-signed-in`, below) — this job holds no credentials.
            - name: Run E2E tests
              env:
                  GL_E2E_CLI_INSIDERS: ${{ inputs.cli_insiders && '1' || '' }}
              run: >
                  xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x16"
                  pnpm exec playwright test -c tests/e2e/playwright.config.ts
                  --project=${{ matrix.editor.id }} --workers=${{ matrix.editor.ciWorkers || 4 }}
                  --grep-invert @signed-in

            # The frame/heap benchmark is deliberately excluded from the default functional suite. Run it
            # serially and repeatedly in the canonical VS Code leg so its measurements remain comparable.
            - name: Run graph browser performance benchmark
              if: ${{ matrix.editor.id == 'vscode' }}
              run: >
                  xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x16"
                  pnpm run benchmark:graph:browser

            # Upload on both pass and fail (skip only on cancel) so results/report are available to
            # inspect even when the job is green — flaky-retry traces (trace: on-first-retry) land in
            # out/test-results/ but would be dropped by an `if: failure()` gate on a passing run.
            - name: Upload test results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-results-${{ matrix.editor.id }}
                  path: out/test-results/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.editor.id }}
                  path: playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Upload graph performance measurements
              if: ${{ !cancelled() && matrix.editor.id == 'vscode' }}
              uses: actions/upload-artifact@v7
              with:
                  name: graph-browser-performance-${{ matrix.editor.id }}
                  path: out/perf/commit-graph-browser-*.json
                  retention-days: 14
                  if-no-files-found: ignore

    # `@signed-in` specs: a worker signs in to the GitKraken test account (tests/e2e/fixtures/gkSignIn.ts) so the
    # account's cloud integrations come with it — see docs/testing.md § signed-in workers. A separate job, not a step
    # of e2e-tests, so the regular legs never hold the credentials (repository secrets, read only by this job's
    # steps). Off until a maintainer sets the repository variable `E2E_SIGNED_IN` to `true`; on other refs it doesn't
    # start rather than fail. VS Code only, staging only — every sign-in mints an account token the backend never
    # expires, so CI never signs in to production.
    e2e-signed-in:
        name: E2E Tests (VS Code, signed in - staging)
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.E2E_SIGNED_IN == 'true' }}
        permissions:
            contents: read
        # One run at a time: two runs would sign the same test account in at once
        concurrency:
            group: e2e-signed-in
            cancel-in-progress: false
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Test code runs with the credentials below; it doesn't need the token too
                  persist-credentials: false

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Setup pnpm
              uses: pnpm/setup@v2
              with:
                  install: false
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # GitLens reads `gitkraken.env` only in a pre-release (date-versioned) build or in Development mode, and
            # the harness runs extensions in Test mode — so signing in to staging needs the pre-release version patch.
            # It changes nothing but the version (and README).
            - name: Pre-release version (staging backend)
              run: pnpm run patch-pre

            - name: Build (production with DEBUG for simulator)
              run: pnpm run bundle:e2e

            # The scan below is what keeps credentials out of the uploaded artifacts — check it still works first
            - name: Self-test the secret scan
              run: node --test scripts/__tests__/e2eScanForSecrets.test.mjs

            # The credentials exist in this step and the scan below only. E2E_REQUIRE_SIGNIN turns a missing cookie or
            # GitHub URL into a failure instead of a silent skip; no --pass-with-no-tests, so a job that matches no
            # spec fails instead of going green. --retries=0 regardless of the config's CI default: a retry starts a
            # new worker, and every worker sign-in mints a token the backend never expires.
            - name: Run signed-in E2E tests (staging)
              env:
                  GK_E2E_ENV: staging
                  E2E_REQUIRE_SIGNIN: '1'
                  # The staging site's session cookie (`stagingAccessToken`) — the only GitKraken credential CI holds
                  GK_E2E_ACCESS_TOKEN_COOKIE: ${{ secrets.GK_E2E_ACCESS_TOKEN_COOKIE }}
                  # The staging site is behind Cloudflare Access (its API is not)
                  GK_E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.GK_E2E_CF_ACCESS_CLIENT_ID }}
                  GK_E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.GK_E2E_CF_ACCESS_CLIENT_SECRET }}
                  # Read-only on the private test-data repository (E2E_GITHUB_REPO_URL), to clone it
                  GK_E2E_GITHUB_TOKEN: ${{ secrets.GK_E2E_GITHUB_TOKEN }}
                  # Public values, kept as variables so failures stay readable
                  E2E_REQUIRED_INTEGRATIONS: ${{ vars.E2E_REQUIRED_INTEGRATIONS }}
                  E2E_GITHUB_REPO_URL: ${{ vars.E2E_GITHUB_REPO_URL }}
                  E2E_GITHUB_ISSUE_URL: ${{ vars.E2E_GITHUB_ISSUE_URL }}
                  E2E_GITHUB_PR_URL: ${{ vars.E2E_GITHUB_PR_URL }}
              run: >
                  xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x16"
                  pnpm exec playwright test -c tests/e2e/playwright.config.ts
                  --project=vscode --workers=4
                  --grep @signed-in --output out/test-results-signed-in --retries=0

            # Artifacts are uploaded as usual, so make sure no credential rides along: a file holding a secret value
            # (verbatim, base64, base64url, URL-encoded; inside trace zips too) — or that can't be read — is deleted
            # and the job fails, and e-mail addresses and JWT-shaped tokens in text files are masked. Prints only the
            # file and what happened to it.
            - name: Scan e2e output for secrets
              id: scan
              if: ${{ !cancelled() }}
              env:
                  SCAN_SECRET_NAMES: GK_E2E_ACCESS_TOKEN_COOKIE,GK_E2E_CF_ACCESS_CLIENT_SECRET,GK_E2E_GITHUB_TOKEN
                  GK_E2E_ACCESS_TOKEN_COOKIE: ${{ secrets.GK_E2E_ACCESS_TOKEN_COOKIE }}
                  GK_E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.GK_E2E_CF_ACCESS_CLIENT_SECRET }}
                  GK_E2E_GITHUB_TOKEN: ${{ secrets.GK_E2E_GITHUB_TOKEN }}
              run: node scripts/e2eScanForSecrets.mjs out/test-results-signed-in playwright-report

            # Only after a complete scan — one that crashed midway leaves files unscanned, so nothing is uploaded
            - name: Upload test results
              if: ${{ !cancelled() && steps.scan.outputs.complete == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-results-vscode-signed-in
                  path: out/test-results-signed-in/
                  # The repository is public: keep results from an account-holding run only as long as a triage needs
                  retention-days: 1
                  if-no-files-found: ignore
